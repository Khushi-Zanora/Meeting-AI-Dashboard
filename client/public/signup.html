<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — MeetingAI</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <style>
    .auth-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-card { width: 100%; max-width: 380px; }
    .auth-card h1 { font-size: 1.3rem; margin-bottom: 4px; text-align: center; }
    .auth-card .sub { font-size: 0.85rem; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
    .auth-footer { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 16px; }
    .strength-bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
    .strength-fill { height: 100%; width: 0%; transition: width 0.2s ease, background 0.2s ease; }
    .strength-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
</head>
<body>

  <div class="auth-shell">
    <div class="card auth-card">
      <h1>Create your account</h1>
      <p class="sub">Start turning meetings into action</p>

      <form id="signupForm" novalidate>
        <div class="field-group">
          <label class="field-label" for="name">Full name</label>
          <input class="field-input" type="text" id="name" placeholder="Jordan Lee" required />
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="email">Email</label>
          <input class="field-input" type="email" id="email" placeholder="you@company.com" required />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="field-with-toggle">
            <input class="field-input" type="password" id="password" placeholder="At least 8 characters" style="width:100%;padding-right:56px" required />
            <button type="button" class="field-toggle-btn" id="togglePassword">Show</button>
          </div>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
          <span class="strength-label" id="strengthLabel"></span>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="field-group">
          <label class="field-label" for="confirmPassword">Confirm password</label>
          <input class="field-input" type="password" id="confirmPassword" placeholder="Re-enter your password" required />
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
        <p class="form-status" id="formStatus"></p>
      </form>

      <p class="auth-footer">Already have an account? <a class="btn-link" href="login.html">Log in</a></p>
    </div>
  </div>

  <script type="module" src="signup.js"></script>
</body>
</html>
